openapi: 3.0.1
info:
  title: Payments Service
  description: Handles payment processing and refunds
  x-cortex-git:
    github:
      repository: cortex-workshops/payments-service
  x-cortex-tag: payments-service
  x-cortex-link:
  - url: https://github.com/cortex-workshops/payments-service#readme
    name: README
    type: docs
  x-cortex-type: service
  x-cortex-groups:
  - financial-systems
  x-cortex-issues:
    jira:
      labels:
      - payments
  x-cortex-owners:
  - name: cortex-workshops/payments-team
    type: group
    provider: GITHUB
  x-cortex-dependency:
  - tag: spanner-us-central1
    description: Payment transactions and refunds
  - tag: billing-service
    description: Records invoices for completed payments
  x-cortex-relationships:
  - type: environment-mapping
    destinations:
    - tag: production
paths:
  /v1/refunds:
    post:
      description: Issue a refund
      requestBody:
        description: Refund details
        required: true
      responses:
        "201":
          description: Refund created
      deprecated: false
  /v1/payments:
    get:
      description: List payments
      responses:
        "200":
          description: A list of payments
      deprecated: false
